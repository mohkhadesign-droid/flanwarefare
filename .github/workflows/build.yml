name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build and run logic tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E "error:" -A3 build.log | grep -vE "^\s*\^\s*$" | head -n 80 | cut -c1-400 > errors.txt || true
          grep -E "What went wrong|check failed" -A2 build.log | head -n 6 >> errors.txt || true
          split -l 8 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            echo "::error title=Build output::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$f")"
          done

      - name: Probe mapped Minecraft names (diagnostic)
        if: always()
        run: |
          JAR=$(find ~/.gradle/caches -name "forge-1.16.5-*_mapped_snapshot_*.jar" ! -name "*sources*" | head -n 1)
          echo "jar: $JAR"
          [ -n "$JAR" ] || exit 0
          for c in net.minecraft.util.text.IFormattableTextComponent net.minecraft.util.text.Style net.minecraft.util.text.Color net.minecraft.scoreboard.ScorePlayerTeam net.minecraft.scoreboard.Scoreboard net.minecraft.entity.AreaEffectCloudEntity; do
            javap -cp "$JAR" "$c" | grep -E "public" | sed 's/^ *//' | cut -c1-160 > probe.txt
            echo "::notice title=$c::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' probe.txt | cut -c1-3900)"
          done
          javap -cp "$JAR" net.minecraft.entity.Entity | grep -E "addTag|getTags|setPosition\(|writeWithoutTypeId|void read\(|startRiding|stopRiding|isCustomNameVisible|setCustomName|getRidingEntity|isInWater|isSneaking|getScoreboardName|isInvisible|void remove\(|isAlive" | sed 's/^ *//' > probe.txt
          echo "::notice title=Entity::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' probe.txt)"
          javap -cp "$JAR" net.minecraftforge.common.ForgeHooks | grep -i chat | sed 's/^ *//' > probe.txt
          javap -cp "$JAR" net.minecraft.util.text.ITextComponent\$Serializer | grep -i json | sed 's/^ *//' >> probe.txt
          javap -cp "$JAR" net.minecraftforge.event.ServerChatEvent | sed 's/^ *//' >> probe.txt
          echo "::notice title=Misc::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' probe.txt)"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: flanwarfare-jar
          path: build/libs/*.jar
          if-no-files-found: error
