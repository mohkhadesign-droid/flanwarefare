name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build and run logic tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
          ./gradlew -p flags-mod build --no-daemon --stacktrace 2>&1 | tee -a build.log
          ./gradlew -p designer-mod build --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Probe KS
        if: always()
        run: |
          J=$(find ~/.gradle/caches -name "forge-1.16.5-36.2.39*mapped*.jar" ! -name "*sources*" | head -1)
          echo "::warning title=JAR::[$J]"
          : > all.txt
          for c in net.minecraft.world.server.ServerWorld net.minecraft.util.registry.DynamicRegistries net.minecraft.util.registry.Registry net.minecraft.world.biome.provider.BiomeProvider net.minecraft.world.gen.ChunkGenerator net.minecraft.world.server.ServerChunkProvider net.minecraft.world.World net.minecraft.stats.ServerStatisticsManager net.minecraft.server.management.PlayerProfileCache net.minecraft.server.MinecraftServer net.minecraft.command.ISuggestionProvider net.minecraft.world.border.WorldBorder net.minecraft.util.RegistryKey net.minecraft.world.biome.BiomeManager; do
            echo "### $c" >> all.txt
            javap -p -cp "$J" $c 2>&1 | grep "(" | grep -v 'lambda\$' | grep -iE "registr|biome|height|chunk|world\(|getKey|keySet|containsKey|getOrDefault|getOptional|getValue|profile|suggest|contains|getLocation|static|func_24|teleport|border|seed|getDataDirectory|getPlayerList" | sed 's/^ *//' | cut -c1-180 >> all.txt || true
          done
          wc -l all.txt
          split -l 24 all.txt part_
          for f in part_*; do echo "::warning title=P::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' $f)"; done

      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E "error:" -A3 build.log | grep -vE "^\s*\^\s*$" | head -n 80 | cut -c1-400 > errors.txt || true
          grep -E "What went wrong|check failed" -A2 build.log | head -n 6 >> errors.txt || true
          split -l 8 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            echo "::error title=Build output::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$f")"
          done

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: flanwarfare-jar
          path: |
            build/libs/*.jar
            flags-mod/build/libs/*.jar
            designer-mod/build/libs/*.jar
          if-no-files-found: error
