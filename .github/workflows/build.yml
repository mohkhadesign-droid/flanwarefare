name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build and run logic tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
          ./gradlew -p flags-mod build --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Probe mappings
        if: always()
        run: |
          J=$(find ~/.gradle/caches -name "forge-1.16.5-36.2.39*mapped*.jar" ! -name "*sources*" | head -1)
          echo "jar: $J"
          for c in net.minecraft.tileentity.BannerPattern net.minecraft.client.gui.screen.Screen net.minecraft.client.gui.screen.inventory.ContainerScreen net.minecraft.inventory.container.Container net.minecraft.inventory.container.Slot net.minecraft.inventory.container.ContainerType net.minecraftforge.common.extensions.IForgeContainerType net.minecraftforge.fml.network.NetworkHooks net.minecraft.client.gui.ScreenManager net.minecraft.inventory.container.SimpleNamedContainerProvider net.minecraft.item.BannerPatternItem net.minecraft.client.multiplayer.PlayerController net.minecraft.inventory.Inventory net.minecraft.client.gui.AbstractGui net.minecraft.client.gui.widget.button.Button; do
            javap -p -cp "$J" $c > p.txt 2>&1 || true
            echo "::warning title=P $c::$(head -c 3800 p.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          done
          javap -p -c -cp "$J" net.minecraft.tileentity.BannerPattern | grep -A6 -E "String (func_|get)[A-Za-z0-9_]*\(\);" | head -40 > q.txt
          echo "::warning title=PB code::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' q.txt)"

      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E "error:" -A3 build.log | grep -vE "^\s*\^\s*$" | head -n 80 | cut -c1-400 > errors.txt || true
          grep -E "What went wrong|check failed" -A2 build.log | head -n 6 >> errors.txt || true
          split -l 8 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            echo "::error title=Build output::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$f")"
          done

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: flanwarfare-jar
          path: |
            build/libs/*.jar
            flags-mod/build/libs/*.jar
          if-no-files-found: error
