name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build and run logic tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -nE "error:|What went wrong|FAILED|check failed" build.log | head -n 30 | cut -c1-900 > errors.txt || true
          split -l 3 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            echo "::error title=Build output::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$f")"
          done

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: flanwarfare-jar
          path: build/libs/*.jar
          if-no-files-found: error
