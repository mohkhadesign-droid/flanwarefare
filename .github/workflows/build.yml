name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build and run logic tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
          ./gradlew -p flags-mod build --no-daemon --stacktrace 2>&1 | tee -a build.log
          ./gradlew -p designer-mod build --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Check server-side methods are not client-only
        run: |
          J=$(find ~/.gradle/caches -name "forge-1.16.5-36.2.39*mapped*.jar" ! -name "*sources*" | head -1)
          javap -v -cp "$J" net.minecraft.inventory.container.ContainerType > ct.txt
          javap -v -cp "$J" net.minecraft.inventory.container.Container > c.txt
          echo "::warning title=CT::$(grep -nE 'public (T|java.lang.Object|net.minecraft.inventory.container.Container) create|OnlyIn|Dist' ct.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          echo "::warning title=C::$(grep -nE 'getType\(\)|OnlyIn' c.txt | head -20 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"

      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E "error:" -A3 build.log | grep -vE "^\s*\^\s*$" | head -n 80 | cut -c1-400 > errors.txt || true
          grep -E "What went wrong|check failed" -A2 build.log | head -n 6 >> errors.txt || true
          split -l 8 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            echo "::error title=Build output::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$f")"
          done

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: flanwarfare-jar
          path: |
            build/libs/*.jar
            flags-mod/build/libs/*.jar
            designer-mod/build/libs/*.jar
          if-no-files-found: error
