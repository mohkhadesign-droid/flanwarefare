name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build and run logic tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
          ./gradlew -p flags-mod build --no-daemon --stacktrace 2>&1 | tee -a build.log
          ./gradlew -p designer-mod build --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Probe KS
        if: always()
        run: |
          J=$(find ~/.gradle/caches -name "forge-1.16.5-36.2.39*mapped*.jar" ! -name "*sources*" | head -1)
          probe() { javap -p -cp "$J" "$1" 2>&1 | grep "(" | grep -v lambda | grep -E "$2" | sed 's/^ *//' | cut -c1-190 > q.txt; split -l 22 q.txt part_; for f in part_*; do echo "::warning title=$1::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' $f)"; done; rm -f part_* ; }
          probe net.minecraft.world.server.ServerWorld "Registr|getChunkProvider|getSeed|getBiome|getHeight"
          probe net.minecraft.util.registry.DynamicRegistries "Registry|func_"
          probe net.minecraft.util.registry.Registry "getKey\(|keySet|containsKey|getOrDefault\(|getOptional|func_243576|getValue"
          probe net.minecraft.world.biome.provider.BiomeProvider "Biome "
          probe net.minecraft.world.gen.ChunkGenerator "BiomeProvider|getSeaLevel|func_222"
          probe net.minecraft.world.server.ServerChunkProvider "getChunkGenerator|isChunkLoaded|chunkExists"
          probe net.minecraft.world.World "getBiome|getHeight\(|getWorldBorder|getChunk\(|isBlockLoaded"
          probe net.minecraft.stats.ServerStatisticsManager "getValue"
          probe net.minecraft.server.management.PlayerProfileCache "GameProfile"
          probe net.minecraft.server.MinecraftServer "getWorld\(|getPlayerProfileCache|getPlayerList|func_240770_D_|getWorlds|getDataDirectory|func_240776_a_"
          probe net.minecraft.command.ISuggestionProvider "suggest"
          probe net.minecraft.world.border.WorldBorder "contains"
          probe net.minecraft.util.RegistryKey "static|getLocation"

      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E "error:" -A3 build.log | grep -vE "^\s*\^\s*$" | head -n 80 | cut -c1-400 > errors.txt || true
          grep -E "What went wrong|check failed" -A2 build.log | head -n 6 >> errors.txt || true
          split -l 8 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            echo "::error title=Build output::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$f")"
          done

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: flanwarfare-jar
          path: |
            build/libs/*.jar
            flags-mod/build/libs/*.jar
            designer-mod/build/libs/*.jar
          if-no-files-found: error
