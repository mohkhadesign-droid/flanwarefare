buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'

// Each GitHub Actions build gets its own number (e.g. 1.1.0-b7), visible in the jar name,
// the server log and /war status, so it is always clear which build is installed.
version = System.getenv('GITHUB_RUN_NUMBER') ? "${mod_version}-b${System.getenv('GITHUB_RUN_NUMBER')}" : mod_version
group = 'net.flanwarfare'
archivesBaseName = 'flanwarfare'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

// Signature-only stubs of the Flan 1.7.2 classes this add-on calls. They are compiled
// against Minecraft but are compileOnly: they are never packaged into the jar, so no Flan
// code is redistributed. At runtime the real classes come from the installed Flan jar.
sourceSets {
    flanstubs {
        java { srcDir 'src/flanstubs/java' }
    }
}

minecraft {
    // MCP mappings are required for 1.16.5 so that class names match the production
    // (SRG) class names that Flan's own bytecode references.
    mappings channel: 'snapshot', version: '20210309-1.16.5'
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

// The stubs reference Minecraft/Forge types, so give them the same Minecraft classpath.
configurations.getByName('flanstubsCompileOnly').extendsFrom(configurations.getByName('minecraft'))

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly sourceSets.flanstubs.output
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'flanwarfare',
            'Specification-Vendor'    : 'flanwarfare',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'flanwarfare',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : 'flanwarfare.mixins.json'
        ])
    }
    // Defensive: the stubs must never end up in the release jar.
    exclude 'io/github/flemmli97/**'
}

jar.finalizedBy('reobfJar')

// Dependency-free tests of the Minecraft-independent logic (clock maths, capture rules,
// capturer selection). Runs as part of `./gradlew build`.
task logicTest(type: JavaExec) {
    group = 'verification'
    description = 'Runs LogicSelfTest'
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('net.flanwarfare.logic.LogicSelfTest')
}
check.dependsOn logicTest
